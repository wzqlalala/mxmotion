<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 凸轮副：偏心梨形凸轮 + 滚子推杆从动件 + 红箭头运动指示（与齿轮副/齿轮齿条副同色系） -->
  <!-- 推杆导向套与推杆 -->
  <rect x="17" y="2.5" width="6" height="4" rx="1" fill="#CBD5E1" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="20" y1="2" x2="20" y2="11.5" stroke="#1E293B" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 梨形偏心凸轮廓线 -->
  <path d="M8.5 13 C11.5 9.2 18.2 10.2 20.8 13.8 C23.2 17.2 21.2 23.2 16.5 25.8 C11.2 28.6 5.2 25.6 4.5 20.2 C4.0 16.6 6.0 15.2 8.5 13 Z"
        fill="#3B82F6" stroke="#1E293B" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- 凸轮偏心回转轴孔 -->
  <circle cx="11.2" cy="20.2" r="3.4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
  <line x1="11.2" y1="17.8" x2="11.2" y2="22.6" stroke="#1E293B" stroke-width="1.3"/>
  <line x1="8.8" y1="20.2" x2="13.6" y2="20.2" stroke="#1E293B" stroke-width="1.3"/>
  <!-- 滚子从动件 -->
  <circle cx="20" cy="11.5" r="3.3" fill="#93C5FD" stroke="#1E293B" stroke-width="1.7"/>
  <circle cx="20" cy="11.5" r="1.2" fill="#1E293B"/>
  <!-- 推杆往复运动红色双箭头 -->
  <line x1="27" y1="4.5" x2="27" y2="13.5" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="24.8,6.5 27,3 29.2,6.5" fill="#EF4444"/>
  <polygon points="24.8,11.5 27,15 29.2,11.5" fill="#EF4444"/>
  <!-- 凸轮旋转红色弧形箭头 -->
  <path d="M5.5 26.8 A9.5 9.5 0 0 0 17.5 28.2" fill="none" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="4.2,24.5 4.2,28.8 8,27.2" fill="#EF4444"/>
</svg>
